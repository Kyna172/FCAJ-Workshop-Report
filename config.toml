baseURL = "https://kyna172.github.io/ojt-report/"
relativeURLs = false
canonifyURLs = true

defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

buildFuture = true

theme = "hugo-theme-learn"

enableRobotsTXT = true

# Search functionality
[outputs]
  home = ["HTML", "RSS", "JSON"]

# Theme configuration
[params]
  themeVariant = "workshop"
  editURL = ""
  description = "First Cloud AI Journey Internship Report"
  author = "Nguyen Anh Ky"

  showVisitedLinks = true
  disableBreadcrumb = false
  disableNextPrev = false
  disableSearch = false
  disableLanguageSwitchingButton = false

# English version
[Languages]

[Languages.en]
  title = "Internship Report"
  weight = 1
  languageName = "English"
  label = "English"

[[Languages.en.menu.shortcuts]]
  name = "<i class='fab fa-aws'></i> AWS Study Group - Blog"
  identifier = "AWS Study Group"
  url = "https://awsstudygroup.com"
  weight = 20

[[Languages.en.menu.shortcuts]]
  name = "<i class='fab fa-facebook'></i> AWS Study Group - FB Group"
  identifier = "AWS Study Group FB"
  url = "https://www.facebook.com/groups/awsstudygroupfcj"
  weight = 21

# Vietnamese version
[Languages.vi]
  title = "Báo cáo thực tập"
  weight = 2
  languageName = "Tiếng Việt"
  label = "Tiếng Việt"

[[Languages.vi.menu.shortcuts]]
  name = "<i class='fab fa-aws'></i> AWS Study Group - Blog"
  identifier = "AWS Study Group"
  url = "https://awsstudygroup.com"
  weight = 20

[[Languages.vi.menu.shortcuts]]
  name = "<i class='fab fa-facebook'></i> AWS Study Group - Nhóm FB"
  identifier = "AWS Study Group FB"
  url = "https://www.facebook.com/groups/awsstudygroupfcj"
  weight = 21

# Markdown and HTML rendering
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

  [markup.highlight]
    codeFences = true
    guessSyntax = false
    lineNos = false
    noClasses = true

  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false
